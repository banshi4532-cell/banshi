<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body{
            background-color:#d39a9a;
            font-family: Arial, sans-serif;
        }
        h1{
            text-align:center;
            margin-bottom:30px;
        }
        table{
            margin:auto;
        }
        td{
            padding:10px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea{
            width:300px;
            padding:8px;
        }
        textarea{
            height:100px;
        }
        .btn{
            text-align:center;
        }
        button{
            padding:10px 20px;
            border-radius: 10px;
            background-color: brown;
        }
    </style>
</head>
<body>
<h1>Student Registration Form</h1>

<form>
<table>
<tr>
    <td>Roll No :</td>
    <td><input type="number"></td>
</tr>
<tr>
    <td>Student Name :</td>
    <td>
        <input type="text" placeholder="First Name">
        </td>
      <th> <p>-</p></th>
      <td>
        <input type="text" placeholder="Last Name">
</td>
</tr>
<tr>
    <td>Father's Name :</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>Date of Birth :</td>
    <td><input type="date"></td>
</tr>
<tr>
    <td>Mobile No :</td>
    <td><input type="tel" placeholder="+91"></td>
</tr>
<tr>
    <td>Email ID :</td>
    <td><input type="email"></td>
</tr>
<tr>
    <td>Password :</td>
    <td><input type="password"></td>
</tr>
<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>
<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>
<tr>
    <td>Course :</td>
    <td>
        <select>
            <option>----------Select Course----------</option>
            <option>Diploma CSE</option>
            <option>Diploma IT</option>
            <option>Diploma Civil</option>
            <option>Diploma Mechanical</option>
        </select>
    </td>
</tr>
<tr>
    <td>Student Photo :</td>
    <td><input type="file"></td>
</tr>
<tr>
    <td>City :</td>
    <td><input type="text"></td>
</tr>
<tr>
    <td>Address :</td>
    <td><textarea></textarea></td>
</tr>
<tr>
    <td colspan="2" class="btn">
        <button type="submit">Register</button>
    </td>
    <td colspan="2" class="btn">
        <button type="reset">Reset</button>
    </td>
</tr>
</table>
</form>
</body>
</html>
